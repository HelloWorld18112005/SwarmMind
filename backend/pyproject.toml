[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "swarmmind-backend"
version = "0.1.0"
description = "Graph-powered multi-agent AI collaboration platform backend"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.1",
    "sse-starlette>=2.0.0",
    "httpx>=0.27.0",
    "falkordb>=1.0.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
